; NelsollaOS — build config for the ESP32-C3 SuperMini firmware.
; The sketch lives in TinytoshESP32/ rather than the default src/, so point
; PlatformIO at it instead of restructuring the tree (keeps upstream merges clean).

[platformio]
src_dir = TinytoshESP32

[env:esp32-c3-supermini]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
; default.csv leaves only 1.25 MB for the app and the firmware already fills 98.9% of
; it, with no headroom to customize. Nothing here uses OTA or a filesystem (config
; lives in NVS via Preferences), so reclaim the unused app1 and most of spiffs.
; nvs stays at 0x9000/0x5000 in both tables, so saved WiFi and settings survive.
board_build.partitions = huge_app.csv
; The Arduino core bundled with this platform version defaults to gnu++11, but the
; firmware needs C++17: structs.h uses `inline constexpr` variables, and PcStats has
; default member initializers, which only keep it an aggregate from C++14 onward.
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    https://github.com/tzapu/WiFiManager.git
    bblanchon/ArduinoJson @ ^6.21.0
    adafruit/Adafruit SSD1306 @ ^2.5.7
    adafruit/Adafruit GFX Library @ ^1.11.5
    adafruit/Adafruit BusIO @ ^1.14.1
    mathertel/OneButton @ ^2.5.0
    ; Required by BambuService (MQTT telemetry). Missing from the upstream
    ; README's platformio.ini, though its Arduino IDE table does list it.
    knolleary/PubSubClient @ ^2.8
